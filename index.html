<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <title>SSAB Reader</title>
  <meta name="description" content="Read Steven Sirski's daily SSAB podcast in Chinese, with pinyin, word definitions, translations and audio.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to episodes</a>

  <header class="bar">
    <div class="bar-inner">
      <span class="brand">SSAB Reader <span class="brand-zh" lang="zh-Hans">中文</span></span>
      <nav class="lib-links" aria-label="Your words"><a href="words.html">★ My words</a></nav>
    </div>
  </header>

  <main id="main">
    <div class="library">
      <header class="lib-head">
        <h1>Daily episodes in Chinese</h1>
        <p class="ep-desc">Each SSAB episode, retold in Chinese. Tap any word for its pinyin and meaning, and listen along with the audio.</p>
      </header>
      <ol class="ep-list" id="ep-list" aria-busy="true">
        <li class="status" id="load-status">Loading episodes…</li>
      </ol>
    </div>
  </main>

  <script src="library.js"></script>
</body>
</html>
